# admin.autodoc.uz: the NestJS API on 127.0.0.1:4000 (pm2 "autodoc-api"), which also serves the
# built dashboard and falls back to index.html for client-side routes.
#
# The public site's endpoints (forms, statistics, /media/) are routed from the autodoc.uz block
# in the autodoc-landing repo (deploy/nginx.conf).
#
# HTTP only here. Merge into the TLS server block; the session cookies are Secure, so the admin
# must be reached over HTTPS (COOKIE_SECURE=true in api/.env).

upstream autodoc_admin_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name admin.autodoc.uz;

    # Optional extra lock: only the office network and VPN reach the admin at all.
    # allow 203.0.113.0/24;
    # deny all;

    # Photos for the media library (Stage 2) are up to 20 MB.
    client_max_body_size 25m;

    # The public endpoints belong to autodoc.uz; nothing here needs them.
    location /api/v1/ {
        return 404;
    }

    # Photos in the media library, straight from disk as on autodoc.uz. The API can serve them
    # too (development); here nginx is faster and keeps those requests out of Node.
    location /media/ {
        alias /var/www/autodoc-admin/api/storage/public/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://autodoc_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
